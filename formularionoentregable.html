<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea1_2</title>
</head>

<body>
    <h1>INDUSTRIAS EXTREMEÑAS S.A.</h1>
    <table></table>
    <form action="manejador.html" enctype="multipart/form-data" method="post" name="industrias" id="ejemploIndustria">
    </form>
    <tr>
        <td>
            <fieldset>
                <legend>FORMULARIO DE PEDIDO</legend>
        <td>
    </tr>
    <tr>
        <td>
            <p style="font-size: large;">
            <fieldset>
                <legend>Datos del Cliente</legend>
                </p>
                <p><label for="nombre">Correo Electronico: </label>
                    <input type="text" name="correo" minlength="6">
                </p>
                <p><label for="nombre">Contraseña: </label>
                    <input type="text" name="contraseña" minlength="6">
                </p>
            </fieldset>
        </td>
        <td>
            <p style="font-size: large;">
            <fieldset>
                <legend>Tipos de Cliente</legend>
                </p>
                <p>
                    <label>
                        <input type="radio" name="etapa" id="particular" value="particulares"
                            checked>Particulares</label>
                </p>
                <p>
                    <label>
                        <input type="radio" name="etapa" id="asociacion" value="asociaciones">Asociación</label>
                </p>
                <p>
                    <label>
                        <input type="radio" name="etapa" id="empresa" value="empresa">Empresa</label>
                </p>
            </fieldset>
        </td>
    </tr>
    </table>






</body>

</html>
