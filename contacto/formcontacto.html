<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de contacto</title>
    <link rel="stylesheet" href="/css/estilos.css">
</head>

<body>
    <header>
        <h1>IES Augustóbriga</h1>
        <figure>
            <img src="../imagenes/logoaugustobriga1.png" width="150" height="150" alt="Logotipo de IES Augustóbriga">
            <figcaption>Fig.1 Logo IES Augustóbriga</figcaption>
        </figure>
    </header>
    <nav>
        <a href="#noticias">Noticias</a>
        <a href="#actividades">| Actividades</a>
        <a href="contacto/formcontacto.html" target="_self" title="Contacto"></a>
        <a href="index.html" target="_self" title="Inicio">| Inicio</a>
    </nav>
    <main>
        <section id="contacto">
            <form action="procesar.php" method="post">
                <fieldset>
                    <legend>Formulario de contacto</legend>
                    <label for="nombre">Nombre:</label>
                    <input type="text" name="nombre" id="nombre" required>
                    <label for="email">Correo:</label>
                    <input type="email" name="email" id="email" required>
                    <label for="teléfono">Teléfono:</label>
                    <input type="tel" name="teléfono" id="teléfono">
                    <label for="fecha">Fecha de visita:</label>
                    <input type="date" name="fecha" id="fecha" required>
                    <label for="motivo">Motivo:</label>
                    <select name="motivo" id="motivo">
                        <option value="info">Información</option>
                        <option value="matricula">Matrícula</option>
                        <option value="otros">Otros</option>
                    </select>
                    <label for="mensaje">Mensaje:</label>
                    <textarea name="mensaje" id="mensaje" rows="4" cols="40"></textarea>

                    <button type="submit">Enviar</button>
                    <button type="reset">Borrar</button>

                </fieldset>
            </form>
        </section>
    </main>

</body>

</html>
